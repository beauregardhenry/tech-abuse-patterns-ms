name: Test count ratchet

# Raises test-count-baseline.txt on main after the test count climbs, instead of relying on each PR
# to bump the file itself -- the same reason coverage-ratchet.yml exists and owns
# coverage-baseline.txt the same way. Keeps the file out of feature branches entirely and lets
# exactly one place -- post-merge, on main -- own writing to it.

on:
  push:
    branches:
      - main

# Read-only: the baseline commit is pushed with the ratchet deploy key, not this token
# (see scripts/push-ratchet-baseline.sh).
permissions:
  contents: read

concurrency:
  group: test-count-ratchet-main
  cancel-in-progress: false

jobs:
  ratchet:
    name: Ratchet the test count baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, '[skip ratchet]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Measure the test count and raise the baseline if it climbed
        run: npx tsx scripts/check-test-count.ts --update-if-higher

      # The deploy key reaches only this step, never dependency installs.
      - name: Commit and push the baseline if it changed
        env:
          RATCHET_DEPLOY_KEY: ${{ secrets.RATCHET_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/push-ratchet-baseline.sh test-count-baseline.txt "chore: ratchet test count baseline [skip ratchet]"
