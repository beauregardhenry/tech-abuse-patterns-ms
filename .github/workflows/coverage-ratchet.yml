name: Coverage ratchet

# Raises coverage-baseline.txt on main after coverage climbs, instead of relying on each PR to
# bump the file itself. Two PRs open at once used to both edit the same line and conflict with
# each other (or silently clobber one another's real number) whenever both raised coverage; this
# keeps the file out of feature branches entirely and lets exactly one place -- post-merge, on
# main -- own writing to it.

on:
  push:
    branches:
      - main

# Read-only: the baseline commit is pushed with the ratchet deploy key, not this token
# (see scripts/push-ratchet-baseline.sh).
permissions:
  contents: read

concurrency:
  group: coverage-ratchet-main
  cancel-in-progress: false

jobs:
  ratchet:
    name: Ratchet the coverage baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!contains(github.event.head_commit.message, '[skip ratchet]')"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Measure coverage and raise the baseline if it climbed
        run: npx tsx scripts/check-coverage.ts --update-if-higher

      # The deploy key reaches only this step, never dependency installs or the test suite.
      - name: Commit and push the baseline if it changed
        env:
          RATCHET_DEPLOY_KEY: ${{ secrets.RATCHET_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/push-ratchet-baseline.sh coverage-baseline.txt "chore: ratchet coverage baseline [skip ratchet]"
