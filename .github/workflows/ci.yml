name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, and dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show toolchain versions
        run: |
          node --version
          npm --version

      - run: npm ci

      - name: Check for banned patterns
        run: npm run check:banned-patterns

      - name: Check the test count ratchet
        run: npm run check:test-count

      - run: npm test

      - name: Check the coverage ratchet
        run: npm run check:coverage

      - run: npm run build

      - run: npm run build:dashboard

      - run: npm run build:data
