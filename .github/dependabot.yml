# Weekly dependency and GitHub Actions updates, as pull requests. Minor and patch updates are
# grouped into one PR per ecosystem; each major update gets its own PR, since those can break
# things (TypeScript, vitest and zod majors included). CI runs on every Dependabot PR like any
# other; it needs no secrets, and its token is read-only.
#
# Auto-merge is not switched on for these PRs automatically: someone enables it (or merges)
# once CI is green. See CLAUDE.md.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
